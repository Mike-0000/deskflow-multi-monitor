/*
 * Deskflow advanced monitor layout example configuration.
 *
 * Place monitors in world coordinates to define cross-machine edges.
 * Partial overlaps are supported: only overlapping edge segments transition.
 */

section: screens
	desktop:
	laptop:
end

section: links
	desktop:
		right = laptop
	laptop:
		left = desktop
end

section: display_layouts
	advancedLayout = true
	desktop:
		main4k:
			id = DISPLAY1
			name = Main 4K
			worldX = 0
			worldY = 0
			width = 3840
			height = 2160
			localX = 0
			localY = 0
			scale = 1.5
			dpi = 144
		secondary:
			id = DISPLAY2
			name = Side Monitor
			worldX = 3840
			worldY = 400
			width = 2560
			height = 1440
			localX = 3840
			localY = 400
	laptop:
		builtin:
			id = DISPLAY1
			name = Laptop Display
			worldX = 3840
			worldY = 600
			width = 1920
			height = 1200
			localX = 0
			localY = 0
end

section: options
	relativeMouseMoves = false
	win32KeepForeground = false
end
